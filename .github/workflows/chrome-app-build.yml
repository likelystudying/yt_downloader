name: Chrome helper apps

# Builds the helper the YT Downloader Chrome extension talks to:
#   macOS:   YT Downloader.app  -> YT-Downloader-mac.zip
#   Windows: YT Downloader.exe  -> YT-Downloader-Setup.exe (Inno Setup, per-user)
#   Ubuntu:  yt-downloader      -> yt-downloader_<version>_amd64.deb
# Each job downloads the real tools, runs real downloads through the built
# helper the way Chrome does, and drives real Chromium with the extension.
#
# To publish a download link without Terminal: Actions tab -> this workflow ->
# Run workflow -> tick "Publish a release" -> Run workflow.

on:
  push:
    branches: [main, mac-chrome-extension]
    paths: ["chrome-app/**", ".github/workflows/chrome-app-build.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["chrome-app/**", ".github/workflows/chrome-app-build.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release with the Mac, Windows and Ubuntu downloads
        type: boolean
        default: false

permissions:
  contents: write  # only used to publish releases

concurrency:
  group: chrome-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Helper tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install yt-dlp pytest
      - run: python -m pytest chrome-app/helper/tests -q

  mac:
    name: Build and check the Mac app
    needs: test
    runs-on: macos-15
    env:
      APP: chrome-app/helper/dist/YT Downloader.app/Contents/MacOS/YT Downloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyinstaller>=6.13,<7" certifi playwright

      - name: App icon
        run: |
          set -eu
          iconset=chrome-app/helper/build/AppIcon.iconset
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s chrome-app/assets/icon-1024.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) chrome-app/assets/icon-1024.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o chrome-app/helper/build/AppIcon.icns

      - name: Build YT Downloader.app
        working-directory: chrome-app/helper
        run: pyinstaller --noconfirm --clean YTDownloader.spec

      - name: Check the app on macOS
        env:
          YTDL_HOME: ${{ runner.temp }}/ytdl-home
        run: |
          set -eu
          file "$APP"
          "$APP" --version
          "$APP" --install-tools        # downloads yt-dlp, FFmpeg, FFprobe, Deno over HTTPS (certifi)
          "$APP" --selftest             # each tool runs; FFmpeg can encode MP3
          YTDL_NM_DIRS="$RUNNER_TEMP/nm" "$APP" --register
          cat "$RUNNER_TEMP/nm/com.likelystudying.ytdownloader.json"
          test -f "$YTDL_HOME/Chrome Extension/manifest.json"
          test -x "$YTDL_HOME/bin/yt-dlp/yt-dlp_macos"   # the unpacked build, not the single file
          # On a real Mac every file the helper writes while Chrome runs it is
          # tagged "downloaded by Chrome". Tag all the tools that way: the helper
          # must clear it, and downloads must still work.
          find "$YTDL_HOME/bin" -type f -exec xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Google Chrome;" {} +
          python3 chrome-app/ci/protocol_check.py "$APP"
          if xattr -lr "$YTDL_HOME/bin" | grep -q com.apple.quarantine; then
            echo "quarantine flag was not cleared"; exit 1
          fi
          codesign --verify --deep --verbose=1 "chrome-app/helper/dist/YT Downloader.app"

      - name: Drive Chromium with the extension and the app
        env:
          YTDL_HOME: ${{ runner.temp }}/ytdl-home
          E2E_SHOTS: ${{ runner.temp }}/shots
        run: |
          mkdir -p "$E2E_SHOTS"
          python3 -m playwright install chromium
          python3 chrome-app/ci/e2e_chromium.py "$APP"

      - name: Zip
        run: |
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "chrome-app/helper/dist/YT Downloader.app" out/YT-Downloader-mac.zip
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-mac
          path: out/YT-Downloader-mac.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-mac
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  windows:
    name: Build and check the Windows app
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      APP: chrome-app\helper\dist\YT Downloader\YT Downloader.exe
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyinstaller>=6.13,<7" certifi playwright

      - name: Build YT Downloader.exe
        working-directory: chrome-app/helper
        run: pyinstaller --noconfirm --clean YTDownloader.spec

      - name: Check the app on Windows
        env:
          YTDL_HOME: ${{ runner.temp }}\ytdl-home
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:APP --version; if ($LASTEXITCODE) { exit 1 }
          & $env:APP --install-tools; if ($LASTEXITCODE) { exit 1 }
          & $env:APP --selftest; if ($LASTEXITCODE) { exit 1 }
          & $env:APP --paths
          $env:YTDL_NM_DIRS = "$env:RUNNER_TEMP\nm"
          & $env:APP --register; if ($LASTEXITCODE) { exit 1 }
          Remove-Item Env:YTDL_NM_DIRS
          Get-Content "$env:RUNNER_TEMP\nm\com.likelystudying.ytdownloader.json"
          if (-not (Test-Path "$env:YTDL_HOME\Chrome Extension\manifest.json")) { throw "extension not copied" }
          if (-not (Test-Path "$env:YTDL_HOME\bin\yt-dlp\yt-dlp.exe")) { throw "unpacked yt-dlp missing" }
          if (-not (Test-Path "$env:YTDL_HOME\bin\ffmpeg\ffprobe.exe")) { throw "ffprobe missing" }
          python chrome-app/ci/protocol_check.py $env:APP; if ($LASTEXITCODE) { exit 1 }

      - name: Registry registration and removal
        env:
          YTDL_HOME: ${{ runner.temp }}\ytdl-reg
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:APP --register; if ($LASTEXITCODE) { exit 1 }
          foreach ($browser in 'Google\Chrome', 'Microsoft\Edge') {
            $key = "HKCU:\Software\$browser\NativeMessagingHosts\com.likelystudying.ytdownloader"
            $manifest = (Get-Item $key).GetValue('')
            Write-Output "$browser -> $manifest"
            $json = Get-Content $manifest -Raw | ConvertFrom-Json
            if (-not (Test-Path $json.path)) { throw "manifest points to a missing file: $($json.path)" }
          }
          & $env:APP --uninstall; if ($LASTEXITCODE) { exit 1 }
          if (Test-Path 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.likelystudying.ytdownloader') { throw "Chrome key not removed" }
          if (Test-Path $env:YTDL_HOME) { throw "support folder not removed" }

      - name: Build the installer
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $version = (Select-String -Path chrome-app/helper/ytdl_helper.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/O$env:GITHUB_WORKSPACE\out" chrome-app\windows\installer.iss
          if ($LASTEXITCODE) { exit 1 }
          Get-Item out\YT-Downloader-Setup.exe | Format-List Name, Length

      - name: Install silently and drive Chromium with the installed app
        env:
          E2E_SHOTS: ${{ runner.temp }}\shots
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force $env:E2E_SHOTS | Out-Null
          $setup = Start-Process out\YT-Downloader-Setup.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup.log"
          if ($setup.ExitCode) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 60; exit 1 }
          $exe = "$env:LOCALAPPDATA\Programs\YT Downloader\YT Downloader.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          & $exe --selftest; if ($LASTEXITCODE) { exit 1 }   # tools the installer downloaded
          python -m playwright install chromium
          python chrome-app/ci/e2e_chromium.py $exe; if ($LASTEXITCODE) { exit 1 }

      - name: Uninstall silently
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:LOCALAPPDATA\Programs\YT Downloader"
          Start-Process "$dir\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\YT Downloader.exe"); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path "$dir\YT Downloader.exe") { throw "app not removed" }
          if (Test-Path 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.likelystudying.ytdownloader') { throw "registry not cleaned" }
          if (Test-Path "$env:LOCALAPPDATA\YT Downloader") { throw "support folder not removed" }
          Write-Output "uninstall clean"

      - uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-Windows
          path: out/YT-Downloader-Setup.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows
          path: ${{ runner.temp }}\shots
          if-no-files-found: ignore

  linux:
    name: Build and check the Ubuntu app
    needs: test
    # Built on the oldest supported Ubuntu so the binary runs on 22.04 and newer.
    runs-on: ubuntu-22.04
    env:
      APP: chrome-app/helper/dist/yt-downloader/yt-downloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyinstaller>=6.13,<7" certifi playwright

      - name: Build yt-downloader
        working-directory: chrome-app/helper
        run: pyinstaller --noconfirm --clean YTDownloader.spec

      - name: Check the app on Ubuntu
        env:
          YTDL_HOME: ${{ runner.temp }}/ytdl-home
        run: |
          set -eu
          "$APP" --version
          "$APP" --install-tools
          "$APP" --selftest
          "$APP" --paths
          YTDL_NM_DIRS="$RUNNER_TEMP/nm" "$APP" --register
          cat "$RUNNER_TEMP/nm/com.likelystudying.ytdownloader.json"
          test -x "$YTDL_HOME/bin/yt-dlp/yt-dlp_linux"
          python3 chrome-app/ci/protocol_check.py "$APP"

      - name: Build the .deb
        run: |
          set -eu
          VERSION=$(python3 -c "import re;print(re.search(r'^VERSION = \"([^\"]+)\"', open('chrome-app/helper/ytdl_helper.py').read(), re.M).group(1))")
          sh chrome-app/linux/build_deb.sh "$VERSION" amd64
          dpkg-deb --contents out/*.deb | grep -E "opt/yt-downloader/(yt-downloader|chrome-extension/manifest.json|native-messaging-host.json)$|applications/|apps/yt-downloader.png"

      - name: Install the .deb and drive Chromium with the installed app
        env:
          E2E_SHOTS: ${{ runner.temp }}/shots
        run: |
          set -eu
          mkdir -p "$E2E_SHOTS"
          sudo apt-get update -qq
          sudo apt-get install -y ./out/yt-downloader_*_amd64.deb
          for d in /etc/opt/chrome /etc/chromium /etc/opt/edge; do
            python3 -c "import json,sys;m=json.load(open(sys.argv[1]));assert m['path']=='/opt/yt-downloader/yt-downloader',m;print(sys.argv[1],'ok')" \
              "$d/native-messaging-hosts/com.likelystudying.ytdownloader.json"
          done
          test -f /usr/share/applications/yt-downloader.desktop
          yt-downloader --install-tools      # the default per-user folder (~/.local/share/YT Downloader)
          yt-downloader --selftest
          yt-downloader --paths | grep -q "extension:       /opt/yt-downloader/chrome-extension"
          python3 -m playwright install --with-deps chromium
          python3 chrome-app/ci/e2e_chromium.py /opt/yt-downloader/yt-downloader

      - name: Remove the .deb
        run: |
          set -eu
          sudo apt-get remove -y yt-downloader
          test ! -e /opt/yt-downloader
          test ! -e /etc/opt/chrome/native-messaging-hosts/com.likelystudying.ytdownloader.json
          test ! -e /etc/opt/edge/native-messaging-hosts/com.likelystudying.ytdownloader.json
          echo "removal clean"

      - uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-Ubuntu
          path: out/*.deb

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ubuntu
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: [mac, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: YT-Downloader-*
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(python3 -c "import re;print(re.search(r'^VERSION = \"([^\"]+)\"', open('chrome-app/helper/ytdl_helper.py').read(), re.M).group(1))")
          TAG="v$VERSION"
          FILES="dist/YT-Downloader-mac/YT-Downloader-mac.zip dist/YT-Downloader-Windows/YT-Downloader-Setup.exe $(ls dist/YT-Downloader-Ubuntu/*.deb)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --target "$GITHUB_SHA" \
              --title "YT Downloader $VERSION (Mac, Windows, Ubuntu)" --notes-file chrome-app/RELEASE_NOTES.md
          fi
