name: Mac app (Chrome helper)

# Builds "YT Downloader.app" on a macOS runner, checks it really works there,
# and uploads YT-Downloader-mac.zip.
#
# To publish a download link without Terminal: Actions tab -> "Mac app (Chrome
# helper)" -> Run workflow -> tick "Publish a release" -> Run workflow.

on:
  push:
    branches: [main, mac-chrome-extension]
    paths: ["mac/**", ".github/workflows/mac-build.yml"]
    tags: ["mac-v*"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac-build.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release with the app zip
        type: boolean
        default: false

permissions:
  contents: write  # only used to publish releases

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Helper tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install yt-dlp pytest
      - run: python -m pytest mac/helper/tests -q

  build:
    name: Build and check the Mac app
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pyinstaller>=6.13,<7" certifi

      - name: App icon
        run: |
          set -eu
          iconset=mac/helper/build/AppIcon.iconset
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s mac/assets/icon-1024.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) mac/assets/icon-1024.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o mac/helper/build/AppIcon.icns

      - name: Build YT Downloader.app
        working-directory: mac/helper
        run: pyinstaller --noconfirm --clean YTDownloader.spec

      - name: Check the app on macOS
        env:
          YTDL_HOME: ${{ runner.temp }}/ytdl-home
        run: |
          set -eu
          APP="mac/helper/dist/YT Downloader.app/Contents/MacOS/YT Downloader"
          file "$APP"
          "$APP" --version
          "$APP" --install-tools        # downloads yt-dlp, FFmpeg, FFprobe, Deno over HTTPS (certifi)
          "$APP" --selftest             # each tool runs; FFmpeg can encode MP3
          YTDL_NM_DIRS="$RUNNER_TEMP/nm" "$APP" --register
          cat "$RUNNER_TEMP/nm/com.likelystudying.ytdownloader.json"
          test -f "$YTDL_HOME/Chrome Extension/manifest.json"
          python3 mac/ci/protocol_check.py "$APP"
          codesign --verify --deep --verbose=1 "mac/helper/dist/YT Downloader.app"

      - name: Zip
        run: |
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "mac/helper/dist/YT Downloader.app" out/YT-Downloader-mac.zip
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-mac
          path: out/YT-Downloader-mac.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/mac-v') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(python3 -c "import re;print(re.search(r'^VERSION = \"([^\"]+)\"', open('mac/helper/ytdl_helper.py').read(), re.M).group(1))")
          TAG="mac-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/YT-Downloader-mac.zip --clobber
          else
            gh release create "$TAG" out/YT-Downloader-mac.zip --target "$GITHUB_SHA" \
              --title "YT Downloader for Mac $VERSION" --notes-file mac/RELEASE_NOTES.md
          fi
